server:
  address: tcp://0.0.0.0:9091

authentication_backend:
  ldap:
    implementation: "lldap"
    address: "ldap://lldap:3890"
    base_dn: "dc=localtest,dc=me"
    user: "uid=authelia,ou=people,dc=localtest,dc=me"
    # password : fourni par AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD (.env)

access_control:
  default_policy: deny
  rules:
    - domain: app.localtest.me
      resources:
        - "^/admin.*$"
      subject: "group:admins"
      policy: one_factor

    - domain: app.localtest.me
      resources:
        - "^/admin.*$"
      policy: deny

    - domain: app.localtest.me
      policy: one_factor

session:
  # secret : fourni par AUTHELIA_SESSION_SECRET (.env)
  cookies:
    - domain: localtest.me
      authelia_url: https://auth.localtest.me
      default_redirection_url: https://app.localtest.me

# identity_validation.reset_password.jwt_secret : fourni par
# AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET (.env)

storage:
  # encryption_key : fourni par AUTHELIA_STORAGE_ENCRYPTION_KEY (.env)
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt

password_policy:
  standard:
    enabled: false
    min_length: 8
    max_length: 0
    require_uppercase: false
    require_lowercase: false
    require_number: false
    require_special: false
  zxcvbn:
    enabled: true
    min_score: 3
